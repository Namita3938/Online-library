<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Online Library</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <nav>

        <h1>📚 Online Library</h1>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="books.html">Books</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

    </nav>


    <!-- Login Section -->

    <section class="login-section">

        <div class="login-box">

            <h2>Login</h2>

            <p class="login-text">
                Login to access your library account
            </p>


            <form>

                <!-- Email -->

                <div class="input-box">

                    <label>Email</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-box">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Remember Me -->

                <div class="remember">

                    <input type="checkbox" id="remember">

                    <label for="remember">
                        Remember Me
                    </label>

                </div>


                <!-- Login Button -->

                <button type="submit" class="login-btn">
                    Login
                </button>


                <!-- Register -->

                <p class="register">

                    Don't have an account?

                    <a href="#">
                        Register Now
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Online Library System |
            All Rights Reserved
        </p>

    </footer>

</body>

</html>
